<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a28" />
      <stop offset="50%" stop-color="#0a0414" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>

    <!-- Свечение для текста и элементов -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Кибер-сетка -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7e22ce" stroke-opacity="0.12" stroke-width="1" />
    </pattern>

    <style>
      @keyframes scanBeam {
        0% { transform: translateY(-180px); }
        100% { transform: translateY(180px); }
      }
      @keyframes eqBar {
        0%, 100% { height: 8px; }
        50% { height: 38px; }
      }
      @keyframes textFlicker {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 12px #c084fc); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 4px #7e22ce); }
      }
      .scanline { animation: scanBeam 4s linear infinite; }
      .nickname { animation: textFlicker 3s ease-in-out infinite; font-family: 'Courier New', monospace, system-ui; font-weight: 900; letter-spacing: 6px; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: eqBar 1.2s ease-in-out infinite alternate; }
      .b1 { animation-delay: 0.1s; }
      .b2 { animation-delay: 0.4s; }
      .b3 { animation-delay: 0.2s; }
      .b4 { animation-delay: 0.6s; }
      .b5 { animation-delay: 0.3s; }
    </style>
  </defs>

  <!-- Карточка и фон -->
  <rect x="2" y="2" width="846" height="176" rx="16" fill="url(#cyberBg)" stroke="#3b1d60" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="176" rx="16" fill="url(#gridPattern)" />

  <!-- Сканирующая полоса -->
  <line class="scanline" x1="2" y1="0" x2="848" y2="0" stroke="#c084fc" stroke-opacity="0.3" stroke-width="2" />

  <!-- ЛЕВАЯ ЧАСТЬ: Иконка терминала -->
  <g transform="translate(45, 45)">
    <rect width="90" height="90" rx="18" fill="#2e1065" fill-opacity="0.2" stroke="#7e22ce" stroke-width="1.5" />
    <text x="45" y="58" text-anchor="middle" font-family="monospace" font-size="34" font-weight="900" fill="#c084fc">>_</text>
  </g>

  <!-- ЦЕНТР: Ник и подписи -->
  <g transform="translate(160, 42)">
    <text class="nickname" x="0" y="42" font-size="38" fill="#ffffff">CLOXOFF</text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" fill="#a855f7" font-weight="600" letter-spacing="2">MOBILE & SOFTWARE DEVELOPER</text>
    <text x="0" y="94" font-family="monospace" font-size="12" fill="#64748b">SYSTEM_READY // RUNNING ON ANDROID & LINUX</text>
  </g>

  <!-- СПРАВА: Анимированный аудио-эквалайзер / волна активности -->
  <g transform="translate(710, 80)">
    <rect class="bar b1" x="0" y="0" width="6" height="24" rx="3" fill="#c084fc" />
    <rect class="bar b2" x="14" y="0" width="6" height="34" rx="3" fill="#a855f7" />
    <rect class="bar b3" x="28" y="0" width="6" height="18" rx="3" fill="#7e22ce" />
    <rect class="bar b4" x="42" y="0" width="6" height="30" rx="3" fill="#c084fc" />
    <rect class="bar b5" x="56" y="0" width="6" height="14" rx="3" fill="#a855f7" />
  </g>

  <!-- Кибер-уголки -->
  <path d="M 12,28 L 12,12 L 28,12" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 838,28 L 838,12 L 822,12" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 12,152 L 12,168 L 28,168" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 838,152 L 838,168 L 822,168" fill="none" stroke="#c084fc" stroke-width="2.5" />
</svg>
