<svg width="840" height="145" viewBox="0 0 840 145" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0d30" />
      <stop offset="55%" stop-color="#10061e" />
      <stop offset="100%" stop-color="#07020e" />
    </linearGradient>

    <radialGradient id="rightBloom" cx="82%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b1d60" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
  </defs>

  <!-- Карточка фона -->
  <rect x="1" y="1" width="838" height="143" rx="22" fill="url(#purpleBg)" stroke="#3b1d60" stroke-width="1.5" />
  <rect x="1" y="1" width="838" height="143" rx="22" fill="url(#rightBloom)" />

  <!-- ЛЕВЫЙ БЛОК: Иконка Lucide по сетке (y: 38..106) -->
  <rect x="36" y="38" width="68" height="68" rx="18" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.38" />
  <g transform="translate(52, 54) scale(1.5)">
    <path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973" fill="none" stroke="#f3e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="m13 12-3 5h4l-3 5" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ЦЕНТРАЛЬНЫЙ БЛОК: Чистая типографика без наезжающих плашек (y: 38..106) -->
  <text x="126" y="57" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="-0.3">iME-Weather</text>
  
  <text x="126" y="82" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#cbd5e1">Cross-platform weather tracking client with Material 3 UI</text>

  <circle cx="131" cy="101" r="3.5" fill="#c084fc" />
  <text x="142" y="105" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="12.5" fill="#d8b4fe">github.com/Cloxoff/iME-Weather</text>

  <!-- ПРАВЫЙ БЛОК: Симметричные плашки статуса и перехода (y: 38..106) -->
  <g transform="translate(634, 38)">
    <!-- Верхняя плашка статуса -->
    <rect x="0" y="0" width="170" height="30" rx="9" fill="#170b2b" stroke="#3b1d60" stroke-width="1" />
    <circle cx="22" cy="15" r="3.5" fill="#34d399" />
    <text x="92" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-weight="700" font-size="10.5" fill="#e9d5ff" letter-spacing="0.8">RELEASE v1.2.0</text>

    <!-- Нижняя кнопка репозитория -->
    <rect x="0" y="38" width="170" height="30" rx="9" fill="url(#btnGrad)" stroke="#7e22ce" stroke-width="1" />
    <text x="85" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff" letter-spacing="0.8">OPEN PROJECT</text>
  </g>
</svg>
