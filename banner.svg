<svg width="800" height="170" viewBox="0 0 800 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0717" />
      <stop offset="60%" stop-color="#07030e" />
      <stop offset="100%" stop-color="#040108" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <radialGradient id="softBloom" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes ping {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .status-dot {
        transform-origin: 154px 34px;
        animation: ping 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="798" height="168" rx="20" fill="url(#cardBg)" stroke="#271442" stroke-width="1.5" />
  <rect x="1" y="1" width="798" height="168" rx="20" fill="url(#softBloom)" />

  <!-- ЛЕВАЯ ИКОНКА -->
  <g transform="translate(32, 34)">
    <rect width="102" height="102" rx="26" fill="#130924" stroke="#3b1d60" stroke-width="1.5" />
    <rect x="6" y="6" width="90" height="90" rx="20" fill="#1b0e33" fill-opacity="0.5" />
    <path d="M34 58a12 12 0 0 1-2.5-23.7A17 17 0 0 1 59 29a13 13 0 0 1 11.5 19A10.5 10.5 0 0 1 66 58H34z" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M48 58l-5.5 13h9l-4 13 13-16.5h-9.5l5.5-9.5h-8.5z" fill="url(#accentGrad)" />
  </g>

  <!-- ЦЕНТРАЛЬНЫЙ БЛОК -->
  <g transform="translate(154, 28)">
    <circle class="status-dot" cx="0" cy="6" r="3.5" fill="#10b981" />
    <text x="12" y="10" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1.5px">SYSTEM ONLINE</text>
    <text x="135" y="10" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">|</text>
    <text x="148" y="10" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="600" fill="#a855f7" letter-spacing="0.5px">v1.2.0 STABLE</text>

    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5px">iME-Weather</text>
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#94a3b8">Real-time meteorological engine & mobile client for Turkmenistan</text>

    <g transform="translate(0, 86)">
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#160c29" stroke="#311752" stroke-width="1" />
      <text x="35" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Android</text>

      <rect x="78" y="0" width="82" height="22" rx="6" fill="#160c29" stroke="#311752" stroke-width="1" />
      <text x="119" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Material 3</text>

      <rect x="168" y="0" width="88" height="22" rx="6" fill="#160c29" stroke="#311752" stroke-width="1" />
      <text x="212" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#c084fc">Clean Arch</text>
    </g>
  </g>

  <!-- ПАНЕЛЬ ТЕЛЕМЕТРИИ СПРАВА -->
  <g transform="translate(566, 30)">
    <rect width="202" height="110" rx="14" fill="#0d061a" stroke="#2a1447" stroke-width="1" />
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 188 0 C 195.732 0 202 6.268 202 14 L 202 28 L 0 28 Z" fill="#160a2c" />
    <circle cx="16" cy="14" r="3.5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="28" cy="14" r="3.5" fill="#eab308" fill-opacity="0.8" />
    <circle cx="40" cy="14" r="3.5" fill="#10b981" fill-opacity="0.8" />
    <text x="186" y="18" text-anchor="end" font-family="monospace" font-size="9.5" font-weight="700" fill="#a855f7">METRIC_OS</text>

    <g transform="translate(14, 48)">
      <text x="0" y="0" font-family="monospace" font-size="11" fill="#64748b">REGIONS</text>
      <text x="174" y="0" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#e2e8f0">5 / 5 ACTIVE</text>
      <text x="0" y="22" font-family="monospace" font-size="11" fill="#64748b">NETWORK</text>
      <text x="174" y="22" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">< 38ms</text>
      <text x="0" y="44" font-family="monospace" font-size="11" fill="#64748b">RADAR</text>
      <text x="174" y="44" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#10b981">SYNCED</text>
    </g>
  </g>
</svg>
